<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAF8F5">
  <title>上传作品 — 风景光影</title>
  <meta name="description" content="上传你的光影作品，与更多人分享。">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="min-h-screen lp-bg lp-fg" data-page="upload">
  <main id="app">
    <div data-include="nav"></div>

    <div class="pt-16 pb-24 md:pb-12">
      <section class="max-w-3xl mx-auto px-4 sm:px-6 pt-6">
        <p class="lp-caption text-sm text-lp-primary reveal">UPLOAD · 上传</p>
        <h1 class="lp-h1 text-2xl sm:text-3xl text-lp-fg mt-1 reveal">发布作品</h1>
        <p class="lp-body text-lp-fg-muted mt-2 reveal">分享你镜头下的一刻光影。</p>
      </section>

      <section class="max-w-3xl mx-auto px-4 sm:px-6 mt-6">
        <form id="upload-form" class="rounded-lp-lg bg-lp-surface border border-lp-border shadow-lp-sm overflow-hidden">

          <!-- 拖拽区 -->
          <div class="p-4 sm:p-6">
            <label id="drop-zone" for="file-input" class="block cursor-pointer rounded-lp-lg border-2 border-dashed border-lp-border-strong bg-lp-surface-2/50 hover:bg-lp-surface-2 hover:border-lp-primary transition-colors p-8 sm:p-10 text-center">
              <div class="w-12 h-12 mx-auto rounded-lp-full bg-lp-primary-tint text-lp-primary flex items-center justify-center mb-3">
                <i data-lucide="image-up" class="w-6 h-6"></i>
              </div>
              <p class="lp-body text-lp-fg font-medium">拖拽照片到这里，或 <span class="text-lp-primary">点击选择</span></p>
              <p class="lp-caption text-xs text-lp-fg-subtle mt-1.5">支持 JPG / PNG / WebP，单张不超过 20MB</p>
              <input id="file-input" type="file" accept="image/*" class="sr-only">
            </label>

            <!-- 预览 -->
            <div id="preview" class="hidden mt-4 rounded-lp-md border border-lp-border overflow-hidden bg-lp-surface-2">
              <div class="flex items-center gap-3 p-3">
                <img id="preview-img" src="" alt="预览" class="w-20 h-20 rounded-lp-md object-cover bg-lp-surface-3">
                <div class="min-w-0 flex-1">
                  <p id="preview-name" class="text-sm font-medium text-lp-fg truncate"></p>
                  <p id="preview-size" class="text-xs text-lp-fg-muted mt-0.5 lp-mono"></p>
                </div>
                <button type="button" id="preview-remove" class="w-8 h-8 rounded-lp-full flex items-center justify-center text-lp-fg-muted hover:bg-lp-surface hover:text-lp-fg transition-colors" aria-label="移除">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- 表单字段 -->
          <div class="px-4 sm:px-6 pb-4 sm:pb-6 space-y-4">
            <div>
              <label class="block text-sm font-medium text-lp-fg mb-1.5" for="f-title">标题</label>
              <input id="f-title" type="text" maxlength="40" placeholder="给这张光影起个名字" class="w-full h-10 px-3 rounded-lp-md bg-lp-bg border border-lp-input text-lp-fg text-sm focus:border-lp-ring outline-none transition-colors">
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-lp-fg mb-1.5" for="f-location">地点</label>
                <input id="f-location" type="text" placeholder="如：云南·玉龙雪山" class="w-full h-10 px-3 rounded-lp-md bg-lp-bg border border-lp-input text-lp-fg text-sm focus:border-lp-ring outline-none transition-colors">
              </div>
              <div>
                <label class="block text-sm font-medium text-lp-fg mb-1.5" for="f-category">分类</label>
                <select id="f-category" class="w-full h-10 px-3 rounded-lp-md bg-lp-bg border border-lp-input text-lp-fg text-sm focus:border-lp-ring outline-none transition-colors">
                  <option value="">选择分类</option>
                  <option>山岳</option><option>森林</option><option>海洋</option>
                  <option>沙漠</option><option>极地</option><option>城市</option><option>其他</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-lp-fg mb-1.5" for="f-desc">描述<span class="text-lp-fg-subtle font-normal">（可选）</span></label>
              <textarea id="f-desc" rows="3" maxlength="160" placeholder="记录下这张照片背后的故事…" class="w-full px-3 py-2 rounded-lp-md bg-lp-bg border border-lp-input text-lp-fg text-sm focus:border-lp-ring outline-none transition-colors resize-none"></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-lp-fg mb-1.5" for="f-tags">标签<span class="text-lp-fg-subtle font-normal">（可选，空格或逗号分隔）</span></label>
              <input id="f-tags" type="text" placeholder="如：日落 雪山 日出" class="w-full h-10 px-3 rounded-lp-md bg-lp-bg border border-lp-input text-lp-fg text-sm focus:border-lp-ring outline-none transition-colors">
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-lp-fg mb-1.5" for="f-visibility">可见范围</label>
                <select id="f-visibility" class="w-full h-10 px-3 rounded-lp-md bg-lp-bg border border-lp-input text-lp-fg text-sm focus:border-lp-ring outline-none transition-colors">
                  <option value="public">公开 · 所有人可见</option>
                  <option value="private">私密 · 仅自己可见</option>
                  <option value="followers">仅关注者可见</option>
                </select>
              </div>
            </div>
            <div id="gps-box">
              <div class="flex items-center justify-between mb-1.5">
                <label class="block text-sm font-medium text-lp-fg">拍摄坐标<span class="text-lp-fg-subtle font-normal">（可选）</span></label>
                <button type="button" id="f-use-mylocation" class="inline-flex items-center gap-1 text-xs text-lp-primary hover:text-lp-primary-hover">
                  <i data-lucide="locate-fixed" class="w-3.5 h-3.5"></i>使用我的位置
                </button>
              </div>
              <div class="grid sm:grid-cols-2 gap-4">
                <input id="f-lat" type="number" step="any" placeholder="纬度，如 30.2741" class="w-full h-10 px-3 rounded-lp-md bg-lp-bg border border-lp-input text-lp-fg text-sm focus:border-lp-ring outline-none transition-colors">
                <input id="f-lng" type="number" step="any" placeholder="经度，如 120.1551" class="w-full h-10 px-3 rounded-lp-md bg-lp-bg border border-lp-input text-lp-fg text-sm focus:border-lp-ring outline-none transition-colors">
              </div>
            </div>

            <!-- 进度条 -->
            <div id="progress" class="hidden">
              <div class="flex items-center justify-between text-xs text-lp-fg-muted mb-1.5">
                <span id="progress-label">上传中…</span>
                <span id="progress-pct" class="lp-mono">0%</span>
              </div>
              <div class="h-1.5 rounded-lp-full bg-lp-surface-2 overflow-hidden">
                <div id="progress-bar" class="h-full w-0 bg-lp-primary transition-[width] duration-200 ease-out"></div>
              </div>
            </div>

            <div class="flex items-center justify-end gap-2 pt-1">
              <button type="reset" class="px-4 h-9 rounded-lp-md border border-lp-border-strong text-lp-fg text-sm font-medium hover:bg-lp-surface-2 transition-colors">重置</button>
              <button id="submit-btn" type="submit" class="flex items-center gap-1.5 px-4 h-9 rounded-lp-md bg-lp-primary text-white text-sm font-medium hover:bg-lp-primary-hover transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
                <i data-lucide="send" class="w-4 h-4"></i>发布作品
              </button>
            </div>
          </div>
        </form>
      </section>
    </div>

    <div data-include="tabbar"></div>
  </main>

  <div data-include="footer"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/partial.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
