<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAF8F5">
  <title>地图探索 — 风景光影</title>
  <meta name="description" content="在地图上探索阿哲的拍摄足迹。">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="min-h-screen lp-bg lp-fg" data-page="map">
  <main id="app">
    <div data-include="nav"></div>

    <div class="pt-16 pb-24 md:pb-12">
      <section class="max-w-lp-container mx-auto px-4 sm:px-6 pt-6">
        <p class="lp-caption text-sm text-lp-primary reveal">MAP · 地图探索</p>
        <h1 class="lp-h1 text-2xl sm:text-3xl text-lp-fg mt-1 reveal">拍摄足迹</h1>
        <p class="lp-body text-lp-fg-muted mt-2 reveal">跟随地图，重访每一处被光影记住的坐标。</p>
      </section>

      <section class="max-w-lp-container mx-auto px-4 sm:px-6 mt-6 grid lg:grid-cols-3 gap-4 lg:gap-6">
        <!-- 地图画布 -->
        <div class="lg:col-span-2 space-y-4 reveal">
          <div class="rounded-lp-lg overflow-hidden border border-lp-border shadow-lp-sm">
            <div id="map-canvas" class="relative w-full aspect-[4/3] sm:aspect-[16/10] bg-lp-surface-2">
              <!-- 等高线背景 -->
              <svg class="absolute inset-0 w-full h-full text-lp-border" viewBox="0 0 800 500" preserveAspectRatio="none" fill="none" aria-hidden="true">
                <path d="M0,120 Q200,80 400,140 T800,120" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
                <path d="M0,200 Q220,150 420,210 T800,200" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                <path d="M0,280 Q180,240 380,290 T800,280" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
                <path d="M0,360 Q240,320 440,370 T800,360" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
                <path d="M0,440 Q200,400 400,450 T800,440" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
                <path d="M120,0 Q160,120 220,250 T260,500" stroke="currentColor" stroke-width="1" opacity="0.25"/>
                <path d="M560,0 Q600,140 640,280 T680,500" stroke="currentColor" stroke-width="1" opacity="0.25"/>
              </svg>
              <!-- 网格 -->
              <div class="absolute inset-0 opacity-[0.4]" style="background-image:linear-gradient(var(--lp-border) 1px,transparent 1px),linear-gradient(90deg,var(--lp-border) 1px,transparent 1px);background-size:48px 48px;"></div>
              <div class="absolute inset-0 bg-gradient-to-br from-lp-primary-tint/40 via-transparent to-lp-surface-3/40"></div>
              <!-- pins 由后端提供后可再动态注入 -->
              <div class="absolute top-3 left-3 flex items-center gap-1.5 px-2.5 h-7 rounded-lp-full bg-lp-surface/85 backdrop-blur border border-lp-border text-xs text-lp-fg-muted">
                <i data-lucide="compass" class="w-3.5 h-3.5 text-lp-primary"></i>足迹地图
              </div>
              <div id="map-summary" class="absolute bottom-3 left-3 right-3 px-3 h-8 rounded-lp-full bg-lp-surface/85 backdrop-blur border border-lp-border text-xs text-lp-fg-muted flex items-center">
                <i data-lucide="info" class="w-3.5 h-3.5 mr-1.5 text-lp-fg-subtle"></i>调整坐标后点搜索，查看附近作品。
              </div>
            </div>
          </div>
          <!-- 坐标 & 搜索控件 -->
          <div class="rounded-lp-lg border border-lp-border bg-lp-surface shadow-lp-sm p-4 sm:p-5 grid sm:grid-cols-[1fr,1fr,1fr,auto,auto] gap-3 sm:gap-3 items-end">
            <div>
              <label class="block text-xs font-medium text-lp-fg-muted mb-1.5">纬度 Lat</label>
              <input id="map-lat" type="number" step="any" placeholder="如 30.2741" class="w-full h-10 px-3 rounded-lp-md bg-lp-bg border border-lp-input text-sm focus:border-lp-ring outline-none">
            </div>
            <div>
              <label class="block text-xs font-medium text-lp-fg-muted mb-1.5">经度 Lng</label>
              <input id="map-lng" type="number" step="any" placeholder="如 120.1551" class="w-full h-10 px-3 rounded-lp-md bg-lp-bg border border-lp-input text-sm focus:border-lp-ring outline-none">
            </div>
            <div>
              <label class="block text-xs font-medium text-lp-fg-muted mb-1.5">半径（公里）</label>
              <input id="map-radius" type="number" min="1" max="500" step="1" value="50" class="w-full h-10 px-3 rounded-lp-md bg-lp-bg border border-lp-input text-sm focus:border-lp-ring outline-none">
            </div>
            <button id="map-here" type="button" class="inline-flex items-center justify-center gap-1 px-3 h-10 rounded-lp-md border border-lp-border bg-lp-surface-2 text-sm font-medium hover:bg-lp-surface transition-colors">
              <i data-lucide="locate-fixed" class="w-4 h-4"></i>当前位置
            </button>
            <button id="map-go" type="button" class="inline-flex items-center justify-center gap-1 px-4 h-10 rounded-lp-md bg-lp-primary text-white text-sm font-medium hover:bg-lp-primary-hover transition-colors">
              <i data-lucide="search" class="w-4 h-4"></i>搜索附近
            </button>
          </div>
        </div>

        <!-- 地点列表 -->
        <div class="reveal">
          <h2 class="lp-h3 text-lp-fg mb-3">附近作品</h2>
          <div id="map-empty" class="hidden text-center py-10 border border-dashed border-lp-border rounded-lp-lg bg-lp-surface/50">
            <i data-lucide="map-pin-off" class="w-7 h-7 mx-auto text-lp-fg-muted/70 mb-2"></i>
            <p class="text-sm text-lp-fg-muted">当前范围内暂无作品</p>
          </div>
          <div id="map-list" class="space-y-2"></div>
        </div>
      </section>
    </div>

    <div data-include="tabbar"></div>
  </main>

  <div data-include="footer"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/partial.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
